<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강의 전사기</title>
    <style>
        #progress-wrap { display: none; margin-top: 20px; }
        #progress-bar {
            width: 100%; height: 24px; background: #eee;
            border-radius: 6px; overflow: hidden;
        }
        #progress-fill {
            height: 100%; width: 0%; background: #4a90e2;
            text-align: center; color: white; line-height: 24px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <h1>강의 파일 업로드</h1>
    <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="media" accept=".mp3,.mp4" required>
        <button type="submit">업로드</button>
    </form>

    <div id="progress-wrap">
        <p id="status-text">전사 진행 중...</p>
        <div id="progress-bar">
            <div id="progress-fill">0%</div>
        </div>
    </div>

    <div id="result-area">
        {% if text %}
            <hr>
            <h2>전사 결과</h2>
            <p>{{ text }}</p>
            <h2>다운로드</h2>
            <a href="/download/txt">TXT 다운로드</a> |
            <a href="/download/srt">SRT 다운로드</a> |
            <a href="/download/pdf">PDF 다운로드</a> |
            <a href="/download/docx">DOCX 다운로드</a>
        {% endif %}
    </div>

    <script>
        const form = document.getElementById("upload-form");
        const progressWrap = document.getElementById("progress-wrap");
        const progressFill = document.getElementById("progress-fill");
        const statusText = document.getElementById("status-text");
        const resultArea = document.getElementById("result-area");

        let displayedPercent = 0; // 현재 화면에 보이는 값
        let targetPercent = 0;    // 서버가 알려준 실제 값

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            progressWrap.style.display = "block";
            resultArea.innerHTML = "";
            displayedPercent = 0;
            targetPercent = 0;
            progressFill.style.width = "0%";
            progressFill.textContent = "0%";
            statusText.textContent = "업로드 중...";

            try {
                await fetch("/upload", { method: "POST", body: formData });
                statusText.textContent = "전사 진행 중...";
                pollProgress();
                animateProgress();
            } catch (err) {
                statusText.textContent = "업로드 실패: " + err;
            }
        });

        // 서버에 실제 값 물어보기 (1초마다)
        function pollProgress() {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch("/progress");
                    const data = await res.json();

                    targetPercent = data.percent;

                    if (data.status === "done") {
                        clearInterval(interval);
                        targetPercent = 100;
                        statusText.textContent = "전사 완료!";
                        setTimeout(() => location.reload(), 500);
                    } else if (data.status === "error") {
                        clearInterval(interval);
                        statusText.textContent = "에러 발생: " + (data.error || "알 수 없음");
                    }
                } catch (err) {
                    clearInterval(interval);
                    statusText.textContent = "진행률 확인 실패";
                }
            }, 1000);
        }

        // 화면 값을 목표 값(targetPercent)까지 부드럽게 채우기 (매 100ms마다 조금씩 증가)
        function animateProgress() {
            const step = setInterval(() => {
                if (displayedPercent < targetPercent) {
                    displayedPercent += 1; // 한 번에 1%씩만 증가 → 튀는 느낌 완화
                }
                progressFill.style.width = displayedPercent + "%";
                progressFill.textContent = displayedPercent + "%";

                if (displayedPercent >= 100) {
                    clearInterval(step);
                }
            }, 100); // 100ms마다 1%씩 → 목표치까지 서서히 채워짐
        }
    </script>
</body>
</html>
